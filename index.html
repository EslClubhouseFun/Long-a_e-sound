:root{
  --navy:#13234A; --pink:#E8457A; --pink-dark:#C22E60; --yellow:#FFD93B; --yellow-dark:#E8B400;
  --sky-top:#8ED3F6; --sky-bot:#D6F1FD; --grass:#7CC95A; --grass-dark:#5DAE3F; --white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky-bot)}
body{font-family:"Fredoka","Nunito",system-ui,sans-serif;color:var(--navy);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:5px solid var(--pink);outline-offset:6px;border-radius:24px}

/* ---------- full-viewport scenery ---------- */
.scene{position:fixed;inset:0;background:linear-gradient(#8ED3F6 0%,#B5E3FA 45%,#D6F1FD 70%);overflow:hidden}
.cloud-bg{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.cloud-bg::before,.cloud-bg::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud-bg::before{width:55%;height:150%;left:15%;bottom:30%}
.cloud-bg::after{width:40%;height:120%;right:12%;bottom:35%}
.c1{width:22vw;height:6vw;left:-4vw;top:34vh}
.c2{width:18vw;height:5vw;right:-3vw;top:40vh}
.c3{width:12vw;height:3.4vw;left:14vw;top:6vh;opacity:.6}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}

/* ---------- 1600x900 stage, scaled to fit ---------- */
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- HOME ---------- */
.logo{position:absolute;left:40px;top:44px;width:240px;filter:drop-shadow(0 4px 0 rgba(19,35,74,.12))}
.title-wrap{position:absolute;left:355px;top:36px;width:890px;height:340px}
.title-cloud{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.title-text{position:absolute;left:0;right:0;top:74px;text-align:center;font-weight:700;font-size:112px;line-height:1;letter-spacing:-1px;white-space:nowrap}
.title-text .big-a{color:var(--pink);font-size:148px;display:inline-block;transform:translateY(-12px);margin:0 2px;
  -webkit-text-stroke:0 transparent;text-shadow:0 6px 0 var(--pink-dark)}
.pattern-chip{position:absolute;left:50%;top:232px;transform:translateX(-50%) rotate(-1deg);background:var(--yellow);
  border-radius:26px;padding:0 56px;height:98px;display:flex;align-items:center;font-weight:700;font-size:90px;line-height:1;
  box-shadow:0 7px 0 var(--yellow-dark);letter-spacing:4px}
.pattern-chip span{display:inline-block;transform:translateY(-8px)}
.burst{position:absolute;overflow:visible}
.bubble{position:absolute;right:44px;top:52px;width:216px;height:292px;transform:rotate(4deg)}
.bubble svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bubble p{position:relative;margin:0;padding:30px 12px 0 22px;text-align:center;color:#fff;font-weight:700;font-size:50px;line-height:1.06;
  text-shadow:0 3px 0 rgba(160,20,70,.35)}
.home-cards{position:absolute;left:0;right:0;top:410px;display:flex;justify-content:center;gap:62px}
.hcard{position:relative;width:300px;height:300px}
.frame{position:absolute;inset:0;width:100%;height:100%}
.pic{position:absolute;inset:13%;width:74%;height:74%;object-fit:contain}
.pic-cane{transform:scale(1)}
.hcard .pic{inset:17%;width:66%;height:66%}
.spark{position:absolute;width:62px;height:62px;overflow:visible}
.banner-row{position:absolute;left:0;right:0;top:750px;display:flex;justify-content:center;align-items:center}
.banner{height:84px;padding:0 52px;background:var(--navy);border-radius:60px;color:#fff;display:flex;align-items:center;gap:34px;
  font-family:"Nunito",sans-serif;font-weight:800;font-size:40px;box-shadow:0 6px 0 rgba(19,35,74,.25)}
.star{width:44px;height:44px;flex:none}
.play-btn{margin-left:-22px;position:relative;z-index:2;height:104px;padding:0 44px 0 34px;border-radius:70px;background:var(--pink);color:#fff;
  font-weight:700;font-size:52px;display:flex;align-items:center;gap:14px;border:6px solid #fff;box-shadow:0 8px 0 var(--pink-dark),0 12px 24px rgba(19,35,74,.25);
  animation:breathe 2.4s ease-in-out infinite}
.play-btn svg{width:40px;height:40px}
.play-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-dark)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ---------- GAME ---------- */
.g-logo{position:absolute;left:50px;top:26px;width:140px}
.round-btn{position:absolute;top:50px;width:96px;height:96px;border-radius:50%;background:#fff;border:6px solid var(--navy);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(19,35,74,.25)}
.round-btn svg{width:48px;height:48px}
.round-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(19,35,74,.25)}
.btn-home{left:232px}
.btn-sound{left:350px}
.btn-sound .off{display:none}
.muted .btn-sound .on-i{display:none}
.muted .btn-sound .off{display:block}

.word-panel{position:absolute;left:50px;top:196px;width:620px;height:650px;background:#fff;border:7px solid var(--navy);border-radius:48px;
  box-shadow:0 10px 0 rgba(19,35,74,.18);display:flex;flex-direction:column;align-items:center}
.progress{display:flex;gap:18px;margin-top:34px}
.progress .dot{width:58px;height:58px}
.progress .dot path{fill:#E6ECF5;stroke:#C9D3E3;stroke-width:5;stroke-linejoin:round;transition:fill .3s}
.progress .dot.done path{fill:var(--yellow);stroke:var(--yellow-dark)}
.progress .dot.now path{stroke:var(--navy)}
.word-area{position:relative;margin-top:76px;height:300px;width:100%;display:flex;justify-content:center;align-items:flex-end}
.arc{position:absolute;left:0;top:0;width:100%;height:110px;overflow:visible}
.arc path.line{fill:none;stroke:var(--pink);stroke-width:9;stroke-linecap:round;stroke-dasharray:6 18}
.arc path.head{fill:var(--pink)}
.arc .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.letters{display:flex;gap:12px}
.tile{width:118px;height:176px;border-radius:28px;background:#F3F6FB;border:6px solid var(--navy);display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:134px;line-height:1;padding-bottom:12px;box-shadow:0 7px 0 rgba(19,35,74,.2)}
.tile.v{background:var(--pink);border-color:var(--pink-dark);color:#fff;box-shadow:0 7px 0 var(--pink-dark)}
.tile.pop{animation:tilepop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tilepop{0%{transform:scale(.3) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.mini-chip{margin-top:40px;background:var(--yellow);border-radius:22px;padding:4px 34px 10px;font-weight:700;font-size:62px;letter-spacing:3px;box-shadow:0 5px 0 var(--yellow-dark)}
.hint{margin-top:auto;margin-bottom:34px;display:flex;align-items:center;gap:14px;font-family:"Nunito",sans-serif;font-weight:800;font-size:36px;color:#51607F}
.hint svg{width:46px;height:46px;flex:none}

.grid{position:absolute;left:730px;top:56px;width:800px;height:790px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:44px}
.pcard{position:relative;width:100%;height:100%;border-radius:18%;transition:transform .15s,opacity .3s,filter .3s}
.pcard:active{transform:scale(.96)}
.pcard .pic{inset:14%;width:72%;height:72%}
.pcard.in{animation:cardin .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cardin{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.pcard.wrong{animation:shake .45s}
.pcard.dim{opacity:.35;filter:grayscale(.8);pointer-events:none}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-22px) rotate(-3deg)}40%{transform:translateX(20px) rotate(3deg)}60%{transform:translateX(-14px)}80%{transform:translateX(10px)}}
.pcard.right{animation:win .7s cubic-bezier(.3,1.6,.5,1) both;z-index:3}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1.06)}}
.check{position:absolute;right:-6px;top:-6px;width:118px;height:118px;display:none}
.pcard.right .check{display:block;animation:tilepop .45s .1s cubic-bezier(.3,1.6,.5,1) both}
.x-mark{position:absolute;right:-4px;top:-4px;width:96px;height:96px;display:none}
.pcard.dim .x-mark{display:block}
.label{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:-30px;background:var(--navy);color:#fff;border-radius:40px;padding:2px 34px 8px;
  font-weight:700;font-size:54px;letter-spacing:3px;display:none;white-space:nowrap;border:5px solid #fff}
.label b{color:#FF8FB3;font-weight:700}
.pcard.right .label{display:block;animation:tilepop .45s .2s cubic-bezier(.3,1.6,.5,1) both}

/* ---------- FINISH ---------- */
.finish-panel{position:absolute;left:120px;right:120px;top:40px;bottom:40px;background:#fff;border:8px solid var(--navy);border-radius:60px;
  box-shadow:0 12px 0 rgba(19,35,74,.18);text-align:center}
.finish-panel h1{margin:40px 0 0;font-size:112px;line-height:1;font-weight:700}
.finish-panel h1 .p{color:var(--pink)}
.finish-sub{margin:18px 0 0;font-family:"Nunito",sans-serif;font-weight:800;font-size:42px;color:#51607F}
.fin-cards{display:flex;justify-content:center;gap:34px;margin-top:44px}
.fcard{position:relative;width:270px;height:270px}
.fcard .label{display:block;font-size:46px;bottom:-26px}
.fcard.in{animation:cardin .5s cubic-bezier(.3,1.5,.5,1) both}
.fin-btns{display:flex;justify-content:center;gap:36px;margin-top:80px}
.big-btn{height:116px;padding:0 54px;border-radius:64px;font-weight:700;font-size:54px;display:flex;align-items:center;gap:16px;color:#fff}
.big-btn svg{width:48px;height:48px}
.big-btn.again{background:var(--pink);box-shadow:0 8px 0 var(--pink-dark)}
.big-btn.home{background:var(--navy);box-shadow:0 8px 0 #0A1430}
.big-btn:active{transform:translateY(6px);box-shadow:none}


/* ---------- word audio ---------- */
.spk{position:absolute;right:-10px;bottom:-10px;width:78px;height:78px;border-radius:50%;background:var(--pink);border:5px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--pink-dark);pointer-events:none}
.spk svg{width:40px;height:40px}
.hcard,.fcard{cursor:pointer}
.hcard:active,.fcard:active{transform:scale(.96)}
.playing .spk,.say-btn.playing{animation:talk .5s ease-in-out infinite alternate}
.playing{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.14)}}
.say-btn{position:absolute;right:26px;top:24px;width:92px;height:92px;border-radius:50%;background:var(--pink);border:6px solid #fff;
  box-shadow:0 6px 0 var(--pink-dark),0 0 0 5px var(--pink-dark);display:flex;align-items:center;justify-content:center}
.say-btn svg{width:46px;height:46px}
.say-btn:active{transform:translateY(4px)}
.fcard .spk{bottom:auto;top:-14px;right:-14px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 250); });
fit();

/* ---------- small svg helpers ---------- */
var SPARK = '<svg class="spark" viewBox="0 0 74 74" aria-hidden="true"><g stroke="#FFD93B" stroke-width="9" stroke-linecap="round"><path d="M40 8 L46 26"/><path d="M8 34 L26 38"/><path d="M14 60 L30 52"/></g></svg>';
var CHECK = '<svg class="check" viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="52" fill="#4CC25A" stroke="#fff" stroke-width="8"/><path d="M34 60 L52 78 L86 42" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var XMARK = '<svg class="x-mark" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="42" fill="#fff" stroke="#9AA6BE" stroke-width="6"/><path d="M32 32 L64 64 M64 32 L32 64" stroke="#9AA6BE" stroke-width="10" stroke-linecap="round"/></svg>';
var STAR = '<path d="M30 4 L38 21 L57 23 L43 36 L47 55 L30 45 L13 55 L17 36 L3 23 L22 21Z"/>';

function labelHTML(w){ var u=w.toUpperCase(); return u[0]+'<b>'+u[1]+'</b>'+u[2]+'<b>'+u[3]+'</b>'; }
function cardHTML(word, colour, extra){
  return '<img class="frame" src="' + FRAME[colour] + '" alt="">' +
         '<img class="pic pic-' + word + '" src="' + IMG[word] + '" alt="' + word + '" draggable="false">' + (extra || "");
}

/* ---------- home cards ---------- */
(function(){
  var sparkPos = [["right:32px;top:30px","transform:scaleX(-1)"],["right:38px;top:34px","transform:scaleX(-1)"],["left:40px;top:44px",""],["right:36px;top:40px","transform:scaleX(-1)"]];
  var h = "";
  HOME_ORDER.forEach(function(w,i){
    var sp = SPARK.replace('class="spark"','class="spark" style="' + sparkPos[i][0] + ';' + sparkPos[i][1] + '"');
    h += '<button class="hcard" data-word="' + w + '" aria-label="Hear ' + w + '">' + cardHTML(w, FRAME_ORDER[i], sp + SPK) + '</button>';
  });
  $("homeCards").innerHTML = h;
  Array.prototype.forEach.call($("homeCards").children, function(el){
    el.addEventListener("click", function(){ unlockAudio(); say(el.getAttribute("data-word"), el); });
  });
})();

/* ---------- sound (Web Audio, no files) ---------- */
var muted = false;
try { muted = localStorage.getItem("longA_ae_muted") === "1"; } catch(e){}
document.body.classList.toggle("muted", muted);
var ctx = null;
function unlockAudio(){
  unlockClips();
  try{
    if(!ctx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }
    if(ctx && ctx.state === "suspended") ctx.resume();
    if(ctx){ var b = ctx.createBuffer(1,1,22050), s = ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); }
  }catch(e){}
}
function tone(freq, start, dur, type, vol){
  if(muted || !ctx) return;
  var t = ctx.currentTime + start, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
}
var sfx = {
  click: function(){ tone(660,0,.09,"triangle",.18); },
  pop:   function(){ tone(520,0,.08,"sine",.15); tone(780,.03,.08,"sine",.1); },
  right: function(){ tone(523,0,.16,"triangle"); tone(659,.12,.16,"triangle"); tone(784,.24,.3,"triangle"); },
  wrong: function(){ tone(220,0,.18,"square",.08); tone(165,.12,.22,"square",.07); },
  fanfare: function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*.14,.28,"triangle",.24); }); tone(1047,.6,.6,"sine",.18); }
};
$("soundBtn").addEventListener("click", function(){
  muted = !muted; document.body.classList.toggle("muted", muted);
  if(muted) stopWord();
  try { localStorage.setItem("longA_ae_muted", muted ? "1" : "0"); } catch(e){}
  unlockAudio(); sfx.click();
});

/* ---------- recorded word audio ---------- */
var clips = {}, current = null, currentEl = null, unlocked = false;
WORDS.forEach(function(w){
  var a = new Audio(AUDIO[w]); a.preload = "auto"; clips[w] = a;
  var s = new Audio(AUDIO_SHORT[w]); s.preload = "auto"; clips[w + ":short"] = s;
});
function unlockClips(){
  if(unlocked) return; unlocked = true;
  Object.keys(clips).forEach(function(w){
    var a = clips[w]; a.muted = true;
    var p = a.play();
    var reset = function(){ if(a !== current){ a.pause(); try{ a.currentTime = 0; }catch(e){} } a.muted = false; };
    if(p && p.then){ p.then(reset).catch(function(){ a.muted = false; }); } else { reset(); }
  });
}
function stopWord(){
  if(current){ current.onended = null; current.pause(); try{ current.currentTime = 0; }catch(e){} }
  if(currentEl) currentEl.classList.remove("playing");
  current = null; currentEl = null;
}
// plays a word clip; calls done() when it finishes (or straight away if it can't play)
// full = true plays the whole recording; otherwise just the word at the end
function say(word, el, done, full){
  stopWord();
  var fin = function(){ if(el) el.classList.remove("playing"); if(current === a){ current = null; currentEl = null; } if(done){ var d = done; done = null; d(); } };
  var a = clips[full ? word : word + ":short"];
  if(muted || !a){ if(done) done(); return; }
  current = a; currentEl = el || null;
  if(el) el.classList.add("playing");
  a.muted = false;
  try{ a.currentTime = 0; }catch(e){}
  a.onended = fin;
  var p = a.play();
  if(p && p.catch) p.catch(fin);
  // safety net in case "ended" never fires
  var ms = (isFinite(a.duration) && a.duration > 0 ? a.duration*1000 : 6000) + 800;
  setTimeout(function(){ if(current === a && a.paused) fin(); }, ms);
}

/* ---------- screens ---------- */
function show(id){
  stopWord();
  ["home","game","finish"].forEach(function(s){ $(s).classList.toggle("on", s === id); });
}

/* ---------- game state ---------- */
var q = 0, locked = false, lastCorrectSlot = -1, timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function buildProgress(){
  var h = "";
  for(var i=0;i<WORDS.length;i++){
    var cls = i < q ? "dot done" : (i === q ? "dot now" : "dot");
    h += '<svg class="' + cls + '" viewBox="0 0 60 60" aria-hidden="true">' + STAR + '</svg>';
  }
  $("progress").innerHTML = h;
  $("progress").setAttribute("aria-label", "Word " + (q+1) + " of " + WORDS.length);
}

function buildWord(word){
  var letters = word.toUpperCase().split("");
  var h = "";
  letters.forEach(function(ch, i){
    var v = (i === 1 || i === 3) ? " v" : "";
    h += '<div class="tile pop' + v + '" style="animation-delay:' + (i*0.08) + 's">' + ch + '</div>';
  });
  var el = $("letters");
  el.innerHTML = h;
  el.setAttribute("aria-label", word);
  drawArc();
}

// the "magic e" jump: an arc from the e tile back over to the a tile
function drawArc(){
  var arc = $("arc");
  arc.innerHTML = "";
  var tiles = $("letters").children;
  if(tiles.length < 4) return;
  // tile centres in panel coordinates (4 tiles, 118 wide, 12 gap, centred in 620)
  var total = 4*118 + 3*12, left = (620 - total)/2;
  var ax = left + 1*(118+12) + 59, ex = left + 3*(118+12) + 59;
  var d = "M " + ex + " 98 C " + (ex-14) + " 4, " + (ax+14) + " 4, " + ax + " 88";
  arc.innerHTML =
    '<path class="line" d="' + d + '"/>' +
    '<path class="head" d="M ' + (ax-18) + ' 76 L ' + ax + ' 104 L ' + (ax+16) + ' 74 Z"/>';
  var line = arc.querySelector(".line");
  // animate the dotted arc drawing in from e to a using a mask stroke
  try{
    var len = line.getTotalLength();
    var mask = document.createElementNS("http://www.w3.org/2000/svg","path");
    mask.setAttribute("d", d);
    mask.setAttribute("fill","none"); mask.setAttribute("stroke","#fff"); mask.setAttribute("stroke-width","18");
    mask.setAttribute("stroke-dasharray", len); mask.setAttribute("stroke-dashoffset", len);
    var m = document.createElementNS("http://www.w3.org/2000/svg","mask");
    m.setAttribute("id","arcMask"); m.setAttribute("maskUnits","userSpaceOnUse");
    m.appendChild(mask); arc.insertBefore(m, arc.firstChild);
    line.setAttribute("mask","url(#arcMask)");
    var head = arc.querySelector(".head"); head.style.opacity = 0;
    var start = null, dur = 700, delay = 450;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ mask.setAttribute("stroke-dashoffset", 0); head.style.opacity = 1; return; }
    later(function(){
      function step(ts){
        if(start === null) start = ts;
        var p = Math.min(1, (ts-start)/dur), e = 1 - Math.pow(1-p, 3);
        mask.setAttribute("stroke-dashoffset", len*(1-e));
        if(p >= 1){ head.style.transition = "opacity .2s"; head.style.opacity = 1; return; }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, delay);
  }catch(e){}
}

function buildGrid(word){
  // shuffle picture positions; keep the answer out of the slot it used last time
  var order;
  do { order = shuffle(WORDS); } while (order.indexOf(word) === lastCorrectSlot);
  lastCorrectSlot = order.indexOf(word);
  var h = "";
  order.forEach(function(w, i){
    h += '<button class="pcard in" data-word="' + w + '" style="animation-delay:' + (0.15 + i*0.08) + 's" aria-label="' + w + '">' +
         cardHTML(w, FRAME_ORDER[i], CHECK + XMARK + '<span class="label">' + labelHTML(w) + '</span>') + '</button>';
  });
  var g = $("grid");
  g.innerHTML = h;
  Array.prototype.forEach.call(g.children, function(btn){
    btn.addEventListener("click", function(){ choose(btn); });
  });
}

function loadQuestion(){
  locked = false;
  var word = WORDS[q];
  buildProgress();
  buildWord(word);
  buildGrid(word);
}

function choose(btn){
  if(locked || btn.classList.contains("dim")) return;
  var word = WORDS[q];
  if(btn.getAttribute("data-word") === word){
    locked = true;
    btn.classList.remove("in"); btn.classList.add("right");
    sfx.right();
    burstAt(btn, 26);
    q++;
    buildProgress();
    var next = function(){ if(q >= WORDS.length){ finish(); } else { loadQuestion(); } };
    var start = Date.now(), gone = false;
    var go = function(){ if(gone) return; gone = true; later(next, Math.max(500, 1700 - (Date.now() - start))); };
    later(function(){ say(word, btn, go); }, 250);
  } else {
    sfx.wrong();
    btn.classList.remove("in","wrong"); void btn.offsetWidth; btn.classList.add("wrong");
    later(function(){ btn.classList.remove("wrong"); btn.classList.add("dim"); }, 460);
  }
}

function startGame(){
  clearTimers(); q = 0; lastCorrectSlot = -1;
  show("game"); loadQuestion();
}

function finish(){
  show("finish");
  var h = "";
  WORDS.forEach(function(w, i){
    h += '<button class="fcard in" data-word="' + w + '" aria-label="Hear ' + w + '" style="animation-delay:' + (0.1 + i*0.12) + 's">' + cardHTML(w, FRAME_ORDER[i], '<span class="label">' + labelHTML(w) + '</span>' + SPK) + '</button>';
  });
  $("finCards").innerHTML = h;
  Array.prototype.forEach.call($("finCards").children, function(el){
    el.addEventListener("click", function(){ say(el.getAttribute("data-word"), el); });
  });
  sfx.fanfare();
  confetti(180);
}

function goHome(){ clearTimers(); stopConfetti(); show("home"); }
$("sayBtn").addEventListener("click", function(){ if(!locked) say(WORDS[q], $("sayBtn"), null, true); });

$("playBtn").addEventListener("click", function(){ unlockAudio(); unlockClips(); sfx.click(); startGame(); });
$("homeBtn").addEventListener("click", function(){ unlockAudio(); sfx.click(); goHome(); });
$("againBtn").addEventListener("click", function(){ unlockAudio(); sfx.click(); stopConfetti(); startGame(); });
$("finHomeBtn").addEventListener("click", function(){ unlockAudio(); sfx.click(); goHome(); });

/* ---------- confetti ---------- */
var cv = $("confetti"), cx2 = cv.getContext("2d"), parts = [], raf = null;
var COLS = ["#E8457A","#FFD93B","#4CC25A","#2E9BF0","#A259F4","#fff"];
function sizeCanvas(){ var d = window.devicePixelRatio || 1; cv.width = innerWidth*d; cv.height = innerHeight*d; cx2.setTransform(d,0,0,d,0,0); }
window.addEventListener("resize", sizeCanvas); sizeCanvas();
function addPart(x, y, spread, up){
  parts.push({x:x, y:y, vx:(Math.random()-.5)*spread, vy:-(Math.random()*up + up*.3), r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
              w:8+Math.random()*10, h:6+Math.random()*8, c:COLS[(Math.random()*COLS.length)|0], life:0});
}
function burstAt(el, n){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var r = el.getBoundingClientRect();
  for(var i=0;i<n;i++) addPart(r.left + r.width/2, r.top + r.height*0.35, 14, 12);
  run();
}
function confetti(n){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(var i=0;i<n;i++) addPart(Math.random()*innerWidth, -20 - Math.random()*innerHeight*0.5, 4, -2);
  run();
}
function run(){
  if(raf) return;
  (function frame(){
    cx2.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(function(p){
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.r); cx2.fillStyle = p.c; cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx2.restore();
    });
    parts = parts.filter(function(p){ return p.y < innerHeight + 40 && p.life < 600; });
    if(parts.length){ raf = requestAnimationFrame(frame); } else { raf = null; cx2.clearRect(0,0,innerWidth,innerHeight); }
  })();
}
function stopConfetti(){ parts = []; }

/* expose a tiny hook for automated QA */
window.__game = { get q(){ return q; }, words: WORDS };
})();
</script>
